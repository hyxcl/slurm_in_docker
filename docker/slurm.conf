# slurm.conf file generated by configurator.html.
# Put this file on all nodes of your cluster.
# See the slurm.conf man page for more information.

GresTypes=gpu
MpiDefault=pmix      # subject to change
ProctrackType=proctrack/cgroup
ReturnToService=1
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/var/run/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SwitchType=switch/none
TaskPlugin=task/affinity
InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
AccountingStorageType=accounting_storage/none
JobCompType=jobcomp/none
JobAcctGatherFrequency=30
JobAcctGatherType=jobacct_gather/none
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurmd.log

ClusterName=gb200
SlurmctldHost=dgxa100
NodeName=node[1-2] Gres=gpu:8 CPUs=224 Boards=1 Sockets=2 CoresPerSocket=56 ThreadsPerCore=2 RealMemory=409600
#NodeName=dgxa100 Gres=gpu:8 CPUs=80 Boards=1 Sockets=2 CoresPerSocket=20 ThreadsPerCore=2 RealMemory=409600
PartitionName=su Nodes=ALL Default=YES MaxTime=INFINITE State=UP

